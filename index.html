<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Richuncle Attendance</title>
<style>
  :root {
    --ink: #1c2a24; --paper: #f6f3ec; --moss: #2f5d3a; --moss-deep: #1f3f27; --clay: #c46b3e;
    --line: #d9d3c4; --warn: #b3441e;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--paper); color: var(--ink); font-family: var(--font-body); }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  .card { width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 30px 26px; box-shadow: 0 1px 2px rgba(28,42,36,0.04), 0 12px 32px rgba(28,42,36,0.06); }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--moss); margin-bottom: 6px; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.15; color: var(--moss-deep); margin-bottom: 4px; }
  .clock { font-family: var(--font-mono); font-size: 13px; color: #6b6358; margin: 6px 0 22px; }
  .clock strong { color: var(--moss-deep); font-size: 22px; margin-right: 8px; }
  label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--moss-deep); margin: 16px 0 8px; }
  select, input { width: 100%; padding: 14px 16px; font-size: 16px; font-family: var(--font-body); border: 1.5px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); appearance: none; }
  input.pin { font-family: var(--font-mono); letter-spacing: 0.5em; font-size: 22px; text-align: center; }
  select:focus, input:focus { outline: none; border-color: var(--moss); }
  .status-box { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 14px; line-height: 1.5; border: 1px solid var(--line); background: #f1efe8; color: #6b6358; }
  .status-box.ok { background: #eaf2ec; border-color: #c4dccb; color: var(--moss-deep); }
  .status-box.warn { background: #fbeee6; border-color: #ecc8b4; color: var(--warn); }
  .status-box .small { font-family: var(--font-mono); font-size: 12px; opacity: 0.75; margin-top: 4px; display: block; }
  .result { margin-top: 16px; padding: 18px 16px; border-radius: 10px; display: none; }
  .result.show { display: block; }
  .result.ok { background: var(--moss-deep); color: #fff; }
  .result.err { background: #fbeee6; border: 1px solid #ecc8b4; color: var(--warn); }
  .result .big { font-family: var(--font-display); font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  button { width: 100%; padding: 16px 10px; font-family: var(--font-body); font-size: 15px; font-weight: 600; color: #fff; background: var(--moss); border: 2px solid var(--moss); border-radius: 10px; cursor: pointer; }
  button.out { background: #fff; color: var(--moss-deep); }
  button:disabled { background: #c9c4b8; border-color: #c9c4b8; color: #fff; cursor: not-allowed; }
  button:focus-visible, select:focus-visible, input:focus-visible, .link:focus-visible { outline: 3px solid var(--clay); outline-offset: 2px; }
  .link { background: none; border: 0; color: var(--moss); font-size: 13px; font-weight: 600; text-decoration: underline; padding: 0; width: auto; margin-top: 18px; }
  #pinPanel { display: none; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 4px; }
  #pinPanel.show { display: block; }
  #pinPanel button { margin-top: 16px; }
  .links { display: flex; flex-wrap: wrap; gap: 18px; }
  #slipPanel { display: none; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 4px; }
  #slipPanel.show { display: block; }
  #slipPanel > button { margin-top: 14px; }
  .slip { margin-top: 18px; border: 2px solid var(--ink); border-radius: 10px; padding: 18px 16px; color: var(--ink); background: #fff; }
  .slip .top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 10px; }
  .slip .biz { font-weight: 800; letter-spacing: .06em; font-size: 15px; }
  .slip .mo { font-size: 12px; color: #6b6358; }
  .slip .who { font-weight: 700; font-size: 16px; }
  .slip .sub { font-size: 12px; color: #6b6358; margin-bottom: 10px; }
  .slip table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .slip td { padding: 7px 0; border-bottom: 1px solid #e6e1d6; vertical-align: top; }
  .slip td:last-child { text-align: right; white-space: nowrap; padding-left: 10px; }
  .slip td small { display: block; color: #8a8273; font-size: 11.5px; }
  .slip .minus { color: #b3441e; } .slip .plus { color: var(--moss); }
  .slip .net td { border-top: 2px solid var(--ink); border-bottom: 0; font-weight: 800; font-size: 16px; padding-top: 10px; }
  .slip .foot { font-size: 11px; color: #8a8273; margin-top: 12px; line-height: 1.5; }
  .slip .sign { margin-top: 26px; font-size: 12px; display: none; }
  #printBtn { margin-top: 12px; }
  @media print {
    body { background: #fff; padding: 0; display: block; }
    .card { border: 0; box-shadow: none; padding: 0; max-width: none; }
    .card > *:not(#slipPanel) { display: none !important; }
    #slipPanel { display: block !important; border: 0; }
    #slipPanel > *:not(#slipOut) { display: none !important; }
    #printBtn { display: none !important; }
    .slip { border-radius: 0; max-width: 560px; margin: 0 auto; }
    .slip .sign { display: block; }
  }
  .footer-note { margin-top: 20px; font-size: 11.5px; color: #a39c8e; text-align: center; line-height: 1.5; }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #d9d3c4; border-top-color: var(--moss); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Richuncle · Attendance</div>
    <h1>Clock in &amp; out</h1>
    <p class="clock"><strong id="now">--:--</strong><span id="shiftMsg"></span></p>

    <label for="name">Your name</label>
    <select id="name"><option value="">Loading staff list…</option></select>

    <label for="pin">Your PIN</label>
    <input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••" />

    <div id="locStatus" class="status-box"><span class="spinner"></span>Checking your location…</div>

    <div class="actions">
      <button id="inBtn" disabled>Clock in</button>
      <button id="outBtn" class="out" disabled>Clock out</button>
    </div>

    <div id="result" class="result" role="status" aria-live="polite"></div>

    <div class="links"><button class="link" id="slipToggle">My payslip</button><button class="link" id="pinToggle">Change my PIN</button></div>
    <div id="slipPanel">
      <label for="slipMonth">Month</label>
      <select id="slipMonth"><option value="">No payslips available yet</option></select>
      <button id="slipBtn">View my payslip</button>
      <p class="device-note" style="font-size:12px;color:#8a8273;margin-top:8px">Uses the name and PIN entered above. Location is not needed.</p>
      <div id="slipOut"></div>
    </div>
    <div id="pinPanel">
      <label for="oldPin">Current PIN</label>
      <input id="oldPin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" />
      <label for="newPin">New PIN (4–6 digits)</label>
      <input id="newPin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" />
      <label for="newPin2">Repeat new PIN</label>
      <input id="newPin2" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" />
      <button id="pinSave">Save new PIN</button>
    </div>

    <p class="footer-note">Your time is recorded by the server, not your phone.<br/>Location must be on to clock in or out.</p>
  </div>

<script>
  // ============================================================
  //  PASTE YOUR APPS SCRIPT WEB APP URL HERE (ends in /exec)
  // ============================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbyprLtSeK8MN3irH9SRUvWNkqmJLCn0mKbrozuxXNR9jaNvny32LXvcTPdTDUH7kASH/exec";

  const $ = id => document.getElementById(id);
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  let cfg = null, coords = null, nearest = null, busy = false;
  let deviceId = store.get('ru_device');
  if (!deviceId) { deviceId = Math.random().toString(36).slice(2, 10); store.set('ru_device', deviceId); }

  const pad = n => String(n).padStart(2, '0');
  const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  function tick() {
    const d = new Date(); $('now').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    if (!cfg) return;
    const m = d.getHours() * 60 + d.getMinutes(), s = toMin(cfg.start), e = toMin(cfg.end);
    $('shiftMsg').textContent = m < s ? `Shift starts ${cfg.start}` : m <= s + cfg.grace ? (m === s ? 'On time' : 'Grace period') : m < e ? `Shift ends ${cfg.end}` : 'After closing time';
  }
  setInterval(tick, 15000); tick();

  function setLoc(type, html) { const b = $('locStatus'); b.className = 'status-box ' + type; b.innerHTML = html; }
  function showResult(ok, big, text) { const r = $('result'); r.className = 'result show ' + (ok ? 'ok' : 'err'); r.innerHTML = `<div class="big">${big}</div>${text || ''}`; }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function updateButtons() {
    const ready = cfg && coords && nearest && nearest.dist <= cfg.radius && !busy;
    $('inBtn').disabled = $('outBtn').disabled = !ready;
  }

  async function loadConfig() {
    try {
      const r = await fetch(API_URL + '?api=config');
      cfg = await r.json();
      if (!cfg.ok) throw new Error();
      const sel = $('name');
      sel.innerHTML = '<option value="">Select your name…</option>' + cfg.staff.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
      const months = cfg.payslipMonths || [];
      const mName = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }); };
      if (months.length) $('slipMonth').innerHTML = months.map(m => `<option value="${m}">${mName(m)}</option>`).join('');
      const saved = store.get('ru_staff');
      if (saved && cfg.staff.some(s => s.id === saved)) sel.value = saved;
      tick(); locate();
    } catch (e) {
      $('name').innerHTML = '<option value="">Could not load staff list</option>';
      setLoc('warn', 'Could not reach the attendance system. Check your internet and reload the page.');
    }
  }

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000, r = d => d * Math.PI / 180, dLat = r(lat2 - lat1), dLon = r(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(r(lat1)) * Math.cos(r(lat2)) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  function locate() {
    setLoc('', '<span class="spinner"></span>Checking your location…');
    navigator.geolocation.getCurrentPosition(pos => {
      coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      nearest = null;
      cfg.shops.forEach(s => { const d = Math.round(haversine(s.lat, s.lng, coords.lat, coords.lng)); if (!nearest || d < nearest.dist) nearest = { name: s.name, dist: d }; });
      if (nearest && nearest.dist <= cfg.radius) setLoc('ok', `You're at ${esc(nearest.name)}.<span class="small">${nearest.dist}m away (limit ${cfg.radius}m)</span>`);
      else if (nearest) setLoc('warn', `You're too far from any shop.<span class="small">Closest: ${esc(nearest.name)}, ${nearest.dist}m (limit ${cfg.radius}m)</span>`);
      updateButtons();
    }, err => {
      setLoc('warn', err.code === 1 ? 'Location is blocked. Allow location for this page in your browser settings, then reload.' : 'Could not get your location. Make sure location is on and reload.');
      updateButtons();
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }

  async function post(body) {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
    return r.json();
  }

  async function clock(type) {
    const staffId = $('name').value, pin = $('pin').value.trim();
    if (!staffId) { showResult(false, 'Select your name'); $('name').focus(); return; }
    if (!/^\d{4,6}$/.test(pin)) { showResult(false, 'Enter your PIN'); $('pin').focus(); return; }
    busy = true; updateButtons();
    const btn = type === 'IN' ? $('inBtn') : $('outBtn'); const label = btn.textContent;
    btn.innerHTML = '<span class="spinner"></span>Sending…';
    try {
      const res = await post({ action: 'clock', type, staffId, pin, lat: coords.lat, lng: coords.lng, device: deviceId });
      if (res.ok) {
        store.set('ru_staff', staffId); $('pin').value = '';
        showResult(true, `${type === 'IN' ? 'Clocked in' : 'Clocked out'} · ${esc(res.time)}`, esc(res.message));
      } else showResult(false, 'Not recorded', esc(res.error));
    } catch (e) { showResult(false, 'Not recorded', 'No connection to the attendance system. Try again.'); }
    busy = false; btn.textContent = label; updateButtons();
  }
  $('inBtn').addEventListener('click', () => clock('IN'));
  $('outBtn').addEventListener('click', () => clock('OUT'));

  $('pinToggle').addEventListener('click', () => { $('pinPanel').classList.toggle('show'); $('slipPanel').classList.remove('show'); });
  $('slipToggle').addEventListener('click', () => { $('slipPanel').classList.toggle('show'); $('pinPanel').classList.remove('show'); });

  const money = n => 'GHS ' + Number(n || 0).toLocaleString('en-GH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  $('slipBtn').addEventListener('click', async () => {
    const staffId = $('name').value, pin = $('pin').value.trim(), month = $('slipMonth').value;
    const out = $('slipOut');
    if (!staffId) { out.innerHTML = '<div class="result show err"><div class="big">Select your name</div></div>'; return; }
    if (!/^\d{4,6}$/.test(pin)) { out.innerHTML = '<div class="result show err"><div class="big">Enter your PIN above</div></div>'; $('pin').focus(); return; }
    if (!month) { out.innerHTML = '<div class="result show err"><div class="big">No payslips yet</div>Payslips appear here once management finalises the month.</div>'; return; }
    const btn = $('slipBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Loading…';
    try {
      const r = await post({ action: 'payslip', staffId, pin, month });
      if (!r.ok) { out.innerHTML = `<div class="result show err"><div class="big">No payslip</div>${esc(r.error)}</div>`; }
      else {
        $('pin').value = '';
        const R = r.rules;
        out.innerHTML = `<div class="slip">
          <div class="top"><span class="biz">${esc(String(r.business).toUpperCase())}</span><span class="mo">Payslip · ${esc(r.month)}</span></div>
          <div class="who">${esc(r.name)}</div>
          <div class="sub">${esc(r.id)}${r.role ? ' · ' + esc(r.role) : ''}${r.bank ? ' · Paid to ' + esc(r.bank) + ' ' + esc(r.account) : ''}</div>
          <table>
            <tr><td>Basic salary</td><td>${money(r.salary)}</td></tr>
            <tr><td>Days present<small>${r.grace ? r.grace + ' arrival' + (r.grace > 1 ? 's' : '') + ' within the ' + R.grace + '-minute grace period, no deduction' : 'Shift ' + esc(R.start) + '–' + esc(R.end)}</small></td><td>${r.present} of ${r.workingDays}</td></tr>
            <tr><td>Late arrivals: ${r.late}<small>${r.late ? 'Days: ' + esc(r.lateDates) + ' · ' + R.lateHours + ' h at ' + money(r.hourly) + ' each' : 'None, well done'}</small></td><td class="${r.lateDed ? 'minus' : ''}">${r.lateDed ? '− ' + money(r.lateDed) : '–'}</td></tr>
            ${R.deductAbsences ? `<tr><td>Unexcused absences: ${r.missed}</td><td class="${r.absDed ? 'minus' : ''}">${r.absDed ? '− ' + money(r.absDed) : '–'}</td></tr>` : ''}
            <tr><td>Overtime: ${r.otHours} h<small>${r.otHours ? 'Days: ' + esc(r.otDays) + ' · at ' + R.otMult + '× ' + money(r.hourly) : 'No approved overtime'}</small></td><td class="${r.otPay ? 'plus' : ''}">${r.otPay ? '+ ' + money(r.otPay) : '–'}</td></tr>
            ${R.ssnit || R.paye ? `<tr><td>Gross pay</td><td>${money(r.gross)}</td></tr>` : ''}
            ${R.ssnit ? `<tr><td>SSNIT<small>${R.ssnitRate}% of basic salary, paid to your pension</small></td><td class="minus">− ${money(r.ssnit)}</td></tr>` : ''}
            ${R.paye ? `<tr><td>PAYE income tax</td><td class="${r.paye ? 'minus' : ''}">${r.paye ? '− ' + money(r.paye) : '–'}</td></tr>` : ''}
            <tr class="net"><td>Net pay</td><td>${money(r.net)}</td></tr>
          </table>
          <div class="foot">${R.ssnit || R.paye ? '' : 'SSNIT and PAYE not deducted. '}Finalised ${esc(r.finalisedOn)}. Questions about this payslip go to HR.</div>
          <div class="sign">Received by: ______________________ &nbsp; Date: ____________</div>
        </div>
        <button id="printBtn">Print or save as PDF</button>`;
        $('printBtn').addEventListener('click', () => window.print());
      }
    } catch (e) { out.innerHTML = '<div class="result show err"><div class="big">Could not load payslip</div>No connection. Try again.</div>'; }
    btn.disabled = false; btn.textContent = 'View my payslip';
  });
  $('pinSave').addEventListener('click', async () => {
    const staffId = $('name').value, o = $('oldPin').value, n = $('newPin').value, n2 = $('newPin2').value;
    if (!staffId) return showResult(false, 'Select your name first');
    if (!/^\d{4,6}$/.test(n)) return showResult(false, 'New PIN must be 4–6 digits');
    if (n !== n2) return showResult(false, 'The new PINs do not match');
    try {
      const res = await post({ action: 'changePin', staffId, oldPin: o, newPin: n });
      if (res.ok) { showResult(true, 'PIN changed'); ['oldPin', 'newPin', 'newPin2'].forEach(i => $(i).value = ''); $('pinPanel').classList.remove('show'); }
      else showResult(false, 'PIN not changed', esc(res.error));
    } catch (e) { showResult(false, 'PIN not changed', 'No connection. Try again.'); }
  });

  loadConfig();
</script>
</body>
</html>
